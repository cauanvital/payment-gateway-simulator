services:
  db:
    image: postgres:16-alpine
    container_name: cardflow-db
    environment:
      POSTGRES_USER: ${DB_USER:-cardflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cardflow}
      POSTGRES_DB: ${DB_NAME:-cardflow}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cardflow} -d ${DB_NAME:-cardflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cardflow-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      SERVER_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-cardflow}
      DB_PASSWORD: ${DB_PASSWORD:-cardflow}
      DB_NAME: ${DB_NAME:-cardflow}
      DB_SSLMODE: disable
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  db_data:
