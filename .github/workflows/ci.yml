name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: fmt / vet / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Os seguintes arquivos não estão formatados:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests and coverage
        run: |
          go test -race -count=1 -covermode=atomic -coverpkg=./internal/... \
            -coverprofile=coverage-unit ./...
          go tool cover -func=coverage-unit | tee coverage-unit.txt

      - name: Integration tests and coverage
        run: make test-integration

      - name: Publish coverage summary
        run: |
          go tool cover -func=coverage-integration | tee coverage-integration.txt
          python3 scripts/merge_coverage.py coverage-all coverage-unit coverage-integration
          go tool cover -func=coverage-all | tee coverage-all.txt

          {
            echo "## Test coverage"
            echo
            echo "| Suite | Coverage |"
            echo "| --- | --- |"
            echo "| Unit | $(tail -n 1 coverage-unit.txt) |"
            echo "| Integration | $(tail -n 1 coverage-integration.txt) |"
            echo "| Combined | $(tail -n 1 coverage-all.txt) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: go build -o bin/server ./cmd/server
